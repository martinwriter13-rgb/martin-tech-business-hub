y||"";article.append(h,p);return article;};const appended=[];for(const item of data){const target=document.getElementById(item.section_key);if(target&&target!==host&&!target.hasAttribute("data-managed-content")){const replacement=document.createElement(target.tagName.toLowerCase());if(target.id)replacement.id=target.id;replacement.className=target.className||"";replacement.setAttribute("data-managed-content","true");const wrap=document.createElement("div");wrap.className="mt-managed-wrap";const kicker=document.createElement("div");kicker.className="mt-managed-kicker";kicker.textContent="Updated by Martin Tech & Business Hub";wrap.append(kicker,makeCard(item));replacement.append(wrap);target.replaceWith(replacement);}else appended.push(item);}if(appended.length){host.hidden=false;const wrap=document.createElement("div");wrap.className="mt-managed-wrap";const kicker=document.createElement("div");kicker.className="mt-managed-kicker";kicker.textContent="Updates from Martin Tech & Business Hub";wrap.append(kicker);appended.forEach(item=>wrap.append(makeCard(item)));host.replaceChildren(wrap);}}catch(e){console.warn("Managed content load:",e.message);}})();</script><script>(async()=>{try{if(!window.supabase?.createClient)return;const db=window.supabase.createClient("https://zvepoycrqjzuptccdffv.supabase.co","sb_publishable_oqLCl-FRoz_u7Yw3IUANow_4SBJTXqT");const {data,error}=await db.from("site_settings").select("setting_value").eq("setting_key","announcement_banner").eq("is_public",true).maybeSingle();if(error||!data?.setting_value?.enabled||!data.setting_value.text)return;const bar=document.createElement("aside");bar.setAttribute("role","status");bar.style.cssText="padding:12px 18px;text-align:center;background:linear-gradient(90deg,#1d4d8c,#513a88);color:#fff;font-weight:700";bar.textContent=data.setting_value.text;document.body.prepend(bar);}catch(e){console.warn("Website announcement unavailable:",e.message);}})();</script><script>(async()=>{try{if(!window.supabase?.createClient)return;let file=location.pathname.split("/").pop()||"index.html";let slug=file.replace(/\.html$/,"");if(slug==="index")slug="home";if(slug.startsWith("blog-"))slug="blog";const db=window.supabase.createClient("https://zvepoycrqjzuptccdffv.supabase.co","sb_publishable_oqLCl-FRoz_u7Yw3IUANow_4SBJTXqT");const ref=document.referrer?new URL(document.referrer).hostname:null;const {error}=await db.from("site_page_views").insert({page_slug:slug,referrer_host:ref});if(error)console.warn("Page view was not recorded:",error.message);}catch(e){console.warn("Analytics counter unavailable:",e.message);}})();</script></body></html>
